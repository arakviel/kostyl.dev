  <text x="600" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748B">pressed → стиль зворотного зв’язку; onPress — дія</text>
  <rect x="100" y="140" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
