  <text x="124" y="208" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">звичайний вигляд</text>
  <rect x="450" y="140" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="450" y="140" width="8" height="300" rx="4" fill="#2563EB"/>
  <text x="474" y="176" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">pressed</text>
  <text x="474" y="208" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">opacity / колір</text>
