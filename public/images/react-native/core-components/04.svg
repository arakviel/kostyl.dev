<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F172A">ScrollView потребує bounded height</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748B">flex:1 у ланцюгу батьків — інакше «нема куди скролити»</text>
  <rect x="80" y="120" width="500" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="80" y="120" width="8" height="360" rx="4" fill="#DC2626"/>
  <text x="104" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Погано</text>
  <text x="104" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Батько height: auto</text>
  <text x="104" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">ScrollView росте з контентом</text>
  <text x="104" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Скрол не з’являється</text>
  <rect x="620" y="120" width="500" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="620" y="120" width="8" height="360" rx="4" fill="#16A34A"/>
  <text x="644" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Добре</text>
  <text x="644" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Screen flex:1</text>
  <text x="644" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">ScrollView flex:1</text>
  <text x="644" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Контент вищий за вікно</text>

</svg>
