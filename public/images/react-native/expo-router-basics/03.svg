<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Layout обгортає екрани</title>
  <desc id="desc">_layout.tsx як постійна оболонка навколо дочірніх маршрутів</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">_layout.tsx — оболонка, не «сторінка»</text>

  <rect x="200" y="90" width="800" height="340" rx="20" fill="#fff" stroke="#93C5FD" stroke-width="3"/>
  <text x="600" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">Root _layout: ThemeProvider · TripsProvider · Stack</text>

  <rect x="240" y="160" width="720" height="230" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="600" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1E40AF">Дочірній маршрут змінюється тут</text>
  <rect x="280" y="220" width="300" height="140" rx="10" fill="#DBEAFE"/>
  <text x="430" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1E3A8A">(tabs) — вкладки</text>
  <text x="430" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748B">або</text>
  <rect x="620" y="220" width="300" height="140" rx="10" fill="#FEF3C7"/>
  <text x="770" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#92400E">create-trip</text>

  <text x="600" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748B">Providers не розмонтовуються при зміні екрана — стейт теми й trips живе</text>
</svg>
