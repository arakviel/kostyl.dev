  <text x="644" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Жорсткі native deps</text>
  <text x="644" y="254" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Розуміння prebuild</text>

