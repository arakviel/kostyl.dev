<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Форма у вебі та на телефоні</title>
  <desc id="desc">Зліва десктопна форма з повною висотою, справа телефон де клавіатура закриває поля</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Форма: браузер vs телефон</text>
  <text x="600" y="82" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#64748B">На мобільному клавіатура — частина layout-задачі</text>

  <!-- Web panel -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="500" height="460" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="310" y="158" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#2563EB">Веб (десктоп)</text>
  <text x="310" y="184" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#64748B">&lt;input&gt; · багато місця · Tab</text>

  <rect x="110" y="210" width="400" height="300" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
  <rect x="130" y="230" width="360" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="145" y="253" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Email</text>
  <rect x="130" y="280" width="360" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="145" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Пароль</text>
  <rect x="130" y="330" width="360" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="145" y="353" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Імʼя</text>
  <rect x="130" y="390" width="160" height="40" rx="8" fill="#2563EB"/>
  <text x="210" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Надіслати</text>
  <rect x="100" y="530" width="420" height="36" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="310" y="553" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#15803D">Усі поля видно одразу</text>

  <!-- Mobile panel -->
  <g filter="url(#shadow)">
    <rect x="640" y="120" width="500" height="460" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="890" y="158" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#DC2626">Телефон</text>
  <text x="890" y="184" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#64748B">TextInput · мало місця · soft keyboard</text>

  <!-- Phone frame -->
  <rect x="780" y="200" width="220" height="340" rx="24" fill="#0F172A"/>
  <rect x="790" y="218" width="200" height="304" rx="14" fill="#F8FAFC"/>
  <!-- Visible fields -->
  <rect x="802" y="232" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="890" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Email (focus)</text>
  <rect x="802" y="268" width="176" height="28" rx="6" fill="#E2E8F0"/>
  <!-- Keyboard covering rest -->
  <rect x="790" y="310" width="200" height="212" rx="0" fill="#CBD5E1"/>
  <text x="890" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Клавіатура</text>
  <text x="890" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">ховає нижні поля</text>
  <text x="890" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">і кнопку Submit</text>
  <!-- Keys hint -->
  <rect x="808" y="430" width="40" height="28" rx="4" fill="#F1F5F9"/>
  <rect x="856" y="430" width="40" height="28" rx="4" fill="#F1F5F9"/>
  <rect x="904" y="430" width="40" height="28" rx="4" fill="#F1F5F9"/>
  <rect x="808" y="468" width="164" height="28" rx="4" fill="#94A3B8"/>

  <rect x="670" y="550" width="440" height="36" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="890" y="573" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#B91C1C">Потрібні KAV + ScrollView + dismiss</text>
</svg>
