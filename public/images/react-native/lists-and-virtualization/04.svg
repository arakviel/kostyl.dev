<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SectionList: секції з заголовками</title>
  <desc id="desc">Список книг згрупований за жанрами з sticky-заголовками секцій</desc>
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0F172A">SectionList — секції з заголовками</text>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#64748B">title + data[] · stickySectionHeadersEnabled</text>

  <!-- Phone -->
  <rect x="120" y="110" width="280" height="400" rx="28" fill="#0F172A"/>
  <rect x="134" y="132" width="252" height="356" rx="14" fill="#FFFFFF"/>

  <!-- sticky header -->
  <rect x="134" y="132" width="252" height="36" fill="#DBEAFE"/>
  <text x="260" y="155" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8">Фантастика</text>

  <rect x="148" y="180" width="224" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="205" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0F172A">Дюна</text>
  <rect x="148" y="230" width="224" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="255" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0F172A">Нейромант</text>

  <rect x="134" y="282" width="252" height="36" fill="#E0E7FF"/>
  <text x="260" y="305" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4338CA">Детектив</text>
  <rect x="148" y="328" width="224" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="353" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0F172A">Ім'я троянди</text>
  <rect x="148" y="378" width="224" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="403" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0F172A">Дівчина з тату</text>

  <!-- Structure callouts -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <path d="M420 150 L500 150" stroke="#2563EB" stroke-width="2"/>
    <rect x="510" y="120" width="560" height="88" rx="12" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="530" y="150" font-size="16" font-weight="700" fill="#1D4ED8">renderSectionHeader</text>
    <text x="530" y="176" font-size="14" fill="#475569">Заголовок секції. На iOS часто «липне» зверху</text>
    <text x="530" y="196" font-size="14" fill="#475569">(stickySectionHeadersEnabled = true).</text>

    <path d="M420 250 L500 250" stroke="#0F172A" stroke-width="2"/>
    <rect x="510" y="220" width="560" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="530" y="250" font-size="16" font-weight="700" fill="#0F172A">renderItem</text>
    <text x="530" y="276" font-size="14" fill="#475569">Один рядок секції — як у FlatList,</text>
    <text x="530" y="296" font-size="14" fill="#475569">але дані живуть у section.data.</text>

    <path d="M420 350 L500 350" stroke="#7C3AED" stroke-width="2"/>
    <rect x="510" y="320" width="560" height="100" rx="12" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="530" y="350" font-size="16" font-weight="700" fill="#5B21B6">sections = [&#123; title, data &#125;]</text>
    <text x="530" y="376" font-size="14" fill="#475569">Форма даних для SectionList.</text>
    <text x="530" y="396" font-size="14" fill="#475569">Приклад: каталог книг за жанром.</text>
  </g>

  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#94A3B8">Міні-проєкт «Каталог книг» · 200+ items · pull-to-refresh</text>
</svg>
