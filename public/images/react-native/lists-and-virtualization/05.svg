<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Nomad: shell home зі списками</title>
  <desc id="desc">Структура екрана Мандрівник: sticky header з темою, FlashList поїздок, місця, sticky CTA</desc>
  <rect width="1200" height="520" fill="#EEF2FF"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Nomad · home після статті 09</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#64748B">Тема (08) + shell (07) + FlashList / місця (09)</text>

  <!-- Phone -->
  <rect x="80" y="100" width="300" height="380" rx="28" fill="#0F172A"/>
  <rect x="94" y="120" width="272" height="340" rx="14" fill="#F8FAFC"/>

  <!-- sticky header -->
  <rect x="94" y="120" width="272" height="100" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="110" y="150" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Мандрівник</text>
  <text x="110" y="172" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B">тема: світла · 12 поїздок</text>
  <!-- chips -->
  <rect x="110" y="186" width="64" height="22" rx="6" fill="#2563EB"/>
  <text x="142" y="201" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#FFFFFF" font-weight="600">Система</text>
  <rect x="180" y="186" width="54" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="207" y="201" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0F172A" font-weight="600">Світла</text>
  <rect x="242" y="186" width="54" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="269" y="201" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0F172A" font-weight="600">Темна</text>

  <!-- places row -->
  <text x="110" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Останні місця</text>
  <rect x="110" y="250" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="188" y="250" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="266" y="250" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- trip cards -->
  <text x="110" y="318" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Ваші поїздки · FlashList</text>
  <rect x="110" y="328" width="240" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="118" y="336" width="48" height="36" rx="6" fill="#93C5FD"/>
  <text x="176" y="358" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Карпати</text>
  <rect x="110" y="388" width="240" height="28" rx="8" fill="#E2E8F0"/>

  <!-- sticky footer -->
  <rect x="94" y="420" width="272" height="40" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="120" y="428" width="220" height="24" rx="8" fill="#2563EB"/>
  <text x="230" y="444" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Нова поїздка</text>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="440" y="120" width="680" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="470" y="160" font-size="18" font-weight="700" fill="#0F172A">Що звідки в нитці проєкту</text>

    <rect x="470" y="185" width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="498" y="197" font-size="15" font-weight="600" fill="#0F172A">Header + чіпи теми</text>
    <text x="498" y="218" font-size="13" fill="#64748B">стаття 08 · sticky, не скроляться зі списком</text>

    <rect x="470" y="245" width="14" height="14" rx="3" fill="#16A34A"/>
    <text x="498" y="257" font-size="15" font-weight="600" fill="#0F172A">Місця (horizontal FlatList)</text>
    <text x="498" y="278" font-size="13" fill="#64748B">стаття 09 · ListHeaderComponent</text>

    <rect x="470" y="305" width="14" height="14" rx="3" fill="#7C3AED"/>
    <text x="498" y="317" font-size="15" font-weight="600" fill="#0F172A">Поїздки (FlashList)</text>
    <text x="498" y="338" font-size="13" fill="#64748B">стаття 09 · віртуалізація + pull-to-refresh</text>

    <rect x="470" y="365" width="14" height="14" rx="3" fill="#0F172A"/>
    <text x="498" y="377" font-size="15" font-weight="600" fill="#0F172A">Sticky CTA «Нова поїздка»</text>
    <text x="498" y="398" font-size="13" fill="#64748B">стаття 07 · footer поза списком</text>
  </g>
</svg>
