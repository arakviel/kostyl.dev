<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Вкладені навігатори</title>
  <desc id="desc">Root Stack містить Tabs, а вкладка Поїздки містить власний Stack</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Вкладені навігатори (nested)</text>
  <text x="600" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748B">Один layout усередині іншого — не «плоский» список екранів</text>

  <rect x="80" y="100" width="1040" height="400" rx="18" fill="#fff" stroke="#93C5FD" stroke-width="2"/>
  <text x="600" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">Root Stack</text>

  <rect x="120" y="160" width="620" height="300" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="430" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1E40AF">(tabs) · Tabs</text>

  <rect x="150" y="220" width="260" height="200" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="280" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">вкладка Поїздки</text>
  <text x="280" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">внутрішній Stack</text>
  <rect x="175" y="300" width="210" height="36" rx="6" fill="#93C5FD"/>
  <text x="280" y="323" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1E3A8A">index · список</text>
  <rect x="175" y="350" width="210" height="36" rx="6" fill="#BFDBFE"/>
  <text x="280" y="373" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1E3A8A">[id] · деталі</text>

  <rect x="430" y="220" width="140" height="80" rx="10" fill="#E2E8F0"/>
  <text x="500" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Місця</text>
  <rect x="580" y="220" width="140" height="80" rx="10" fill="#E2E8F0"/>
  <text x="650" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Ще</text>

  <rect x="780" y="200" width="300" height="220" rx="14" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="930" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#B45309">create-trip</text>
  <text x="930" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#92400E">presentation: modal</text>
  <text x="930" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#78350F">поверх Root Stack</text>
  <text x="930" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#78350F">tabs під модалкою</text>
</svg>
