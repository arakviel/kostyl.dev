<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Card vs Modal</title>
  <desc id="desc">Звичайний push у stack проти modal presentation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">presentation: card vs modal</text>

  <rect x="60" y="80" width="500" height="350" rx="16" fill="#fff" stroke="#E2E8F0"/>
  <text x="310" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#2563EB">card (звичайний push)</text>
  <rect x="150" y="150" width="320" height="220" rx="20" fill="#0F172A"/>
  <rect x="165" y="170" width="290" height="160" rx="10" fill="#DBEAFE"/>
  <text x="310" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1E3A8A">деталі поїздки</text>
  <rect x="165" y="340" width="90" height="18" rx="4" fill="#2563EB"/>
  <rect x="265" y="340" width="90" height="18" rx="4" fill="#94A3B8"/>
  <rect x="365" y="340" width="90" height="18" rx="4" fill="#94A3B8"/>
  <text x="310" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748B">tab bar часто лишається</text>

  <rect x="640" y="80" width="500" height="350" rx="16" fill="#fff" stroke="#E2E8F0"/>
  <text x="890" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#C2410C">modal</text>
  <rect x="730" y="150" width="320" height="220" rx="20" fill="#0F172A"/>
  <rect x="745" y="190" width="290" height="160" rx="14" fill="#FEF3C7"/>
  <text x="890" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#92400E">форма «Нова поїздка»</text>
  <text x="890" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#B45309">з’їзд зверху / sheet</text>
  <text x="890" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748B">tabs під затемненням</text>
</svg>
