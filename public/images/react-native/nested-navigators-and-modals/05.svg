<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Nomad flow list detail modal</title>
  <desc id="desc">Список поїздок деталі з tab bar і modal форми</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <text x="600" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Nomad: список → деталі → modal</text>

  <rect x="40" y="70" width="240" height="320" rx="20" fill="#0F172A"/>
  <rect x="52" y="90" width="216" height="250" rx="10" fill="#F8FAFC"/>
  <text x="160" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F172A">Поїздки</text>
  <rect x="65" y="140" width="190" height="40" rx="6" fill="#DBEAFE"/>
  <rect x="65" y="190" width="190" height="40" rx="6" fill="#E2E8F0"/>
  <rect x="65" y="300" width="55" height="16" rx="3" fill="#2563EB"/>
  <rect x="130" y="300" width="55" height="16" rx="3" fill="#CBD5E1"/>
  <rect x="195" y="300" width="55" height="16" rx="3" fill="#CBD5E1"/>

  <text x="320" y="220" font-size="28" fill="#94A3B8">→</text>

  <rect x="360" y="70" width="240" height="320" rx="20" fill="#0F172A"/>
  <rect x="372" y="90" width="216" height="250" rx="10" fill="#F8FAFC"/>
  <text x="480" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2563EB">← Список</text>
  <text x="480" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Карпати…</text>
  <rect x="385" y="160" width="190" height="70" rx="6" fill="#CBD5E1"/>
  <rect x="385" y="300" width="55" height="16" rx="3" fill="#2563EB"/>
  <rect x="450" y="300" width="55" height="16" rx="3" fill="#CBD5E1"/>
  <rect x="515" y="300" width="55" height="16" rx="3" fill="#CBD5E1"/>
  <text x="480" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">tabs лишаються</text>

  <text x="640" y="220" font-size="28" fill="#94A3B8">→</text>

  <rect x="680" y="70" width="240" height="320" rx="20" fill="#0F172A"/>
  <rect x="692" y="90" width="216" height="250" rx="10" fill="#1E293B"/>
  <rect x="705" y="130" width="190" height="180" rx="12" fill="#FEF3C7"/>
  <text x="800" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400E">Modal</text>
  <text x="800" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B45309">Нова поїздка</text>
  <text x="800" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">tabs під sheet</text>

  <text x="960" y="220" font-size="28" fill="#94A3B8">→</text>

  <rect x="1000" y="120" width="160" height="200" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="1080" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">back / dismiss</text>
  <text x="1080" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">список + нова</text>
  <text x="1080" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">картка</text>
</svg>
