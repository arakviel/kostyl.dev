<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F172A">Дві «служби»: логіка і малювання</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748B">JS рахує «що показати»; нативний UI малює пікселі на екрані</text>
  <rect x="100" y="120" width="440" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="100" y="120" width="8" height="340" rx="4" fill="#2563EB"/>
  <text x="124" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">JavaScript (логіка)</text>
  <text x="124" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">React-дерево, state</text>
  <text x="124" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Обробники onPress</text>
  <text x="124" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Мережа, валідація</text>
  <text x="124" y="254" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Hermes / JS engine</text>
  <rect x="660" y="120" width="440" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="660" y="120" width="8" height="340" rx="4" fill="#16A34A"/>
  <text x="684" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Native UI (малювання)</text>
  <text x="684" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">UIView / android.view</text>
  <text x="684" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Layout, жести ОС</text>
  <text x="684" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Анімації платформи</text>
  <text x="684" y="254" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Те, що бачить око</text>
  <text x="600" y="300" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#7C3AED">міст / JSI (спрощено)</text>
</svg>
