<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F172A">Шлях натискання кнопки</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748B">Дотик → native → JS handler → setState → знову малювання</text>
  <rect x="60" y="140" width="160" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="140" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0F172A">1. Дотик</text><text x="140" y="198" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748B">палець / Pressable</text>  <path d="M230 180 L280 180" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>  <rect x="290" y="140" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="380" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0F172A">2. Native</text><text x="380" y="198" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748B">подія в UI-шарі</text>  <path d="M480 180 L530 180" stroke="#0F172A" stroke-width="2"/>  <rect x="540" y="140" width="180" height="80" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/><text x="630" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3730A3">3. JS onPress</text><text x="630" y="198" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748B">ваша логіка</text>  <path d="M730 180 L780 180" stroke="#0F172A" stroke-width="2"/>  <rect x="790" y="140" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="880" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0F172A">4. setState</text><text x="880" y="198" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748B">нове дерево</text>  <path d="M980 180 L1030 180" stroke="#0F172A" stroke-width="2"/>  <rect x="1040" y="140" width="120" height="80" rx="12" fill="#DCFCE7" stroke="#86EFAC"/><text x="1100" y="185" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#166534">5. UI</text>  <rect x="200" y="280" width="800" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="200" y="280" width="8" height="200" rx="4" fill="#7C3AED"/>
  <text x="224" y="316" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Важливо</text>
  <text x="224" y="348" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Користувач відчуває кроки 1→5 як «кнопка спрацювала».</text>
  <text x="224" y="370" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Повільний JS або важкий render — лагає саме цей шлях.</text>
  <text x="224" y="392" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">Dev: Metro віддає бандл; prod: бандл всередині збірки.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0F172A"/></marker></defs>
</svg>
