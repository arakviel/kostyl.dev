<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="44" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F172A">Стиль ≠ тема</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748B">StyleSheet описує форму; theme — забарвлення ролей</text>
  <rect x="80" y="120" width="500" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="80" y="120" width="8" height="360" rx="4" fill="#2563EB"/>
  <text x="104" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Стилі (форма)</text>
  <text x="104" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">padding, radius, flex</text>
  <text x="104" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">StyleSheet.create</text>
  <text x="104" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">геометрія екрана</text>
  <rect x="620" y="120" width="500" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="620" y="120" width="8" height="360" rx="4" fill="#7C3AED"/>
  <text x="644" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Тема (колір ролей)</text>
  <text x="644" y="188" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">surface, text, primary</text>
  <text x="644" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">light / dark словники</text>
  <text x="644" y="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569">useTheme().colors</text>

</svg>
