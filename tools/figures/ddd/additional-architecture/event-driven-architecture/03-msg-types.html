<div class="title">Повідомлення: подія й команда</div>
<div class="row"><div class="card amber grow"><h3>Подія (event)</h3><p>Описує зміну, що вже сталася. Одержувач не може її скасувати; лише компенсація (команда).</p><p class="cap">Минулий час: DeliveryScheduled</p></div><div class="card blue grow"><h3>Команда (command)</h3><p>Операція, яку потрібно виконати. Ціль може відхилити її.</p><p class="cap">Наказовий спосіб</p></div></div></div></body></html>
