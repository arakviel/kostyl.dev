<div class="title">Навіщо стислі сповіщення</div>
<div class="row"><div class="card red grow"><h3>Безпека</h3><p>Чутливі дані не передаються через інфраструктуру обміну повідомленнями; підписник авторизується окремо.</p></div><div class="card amber grow"><h3>Паралелізм</h3><p>Дані могли застаріти; явний запит дає актуальний стан. З конкурентними споживачами можна поєднати з песимістичним блокуванням.</p></div></div></div></body></html>
