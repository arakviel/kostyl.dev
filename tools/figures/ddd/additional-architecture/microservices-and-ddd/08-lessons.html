<div class="title">Уроки наївної декомпозиції</div>
<div class="row"><div class="card red grow"><p class="cross">неможливо: сервісам потрібні інтеграційні методи</p></div><div class="card red grow"><p class="cross">виграли битву, програли війну: кожен сервіс простіший, система складніша</p></div></div>
<p class="sub" style="margin-top:14px">Система не може складатися з незалежних компонентів: вона — набір пов'язаних, що працюють разом.</p></div></body></html>
