<div class="title">Локальна й глобальна складність</div>
<div class="row"><div class="card blue grow"><h3>Локальна</h3><p>Складність окремого мікросервісу; залежить від реалізації.</p></div><div class="card violet grow"><h3>Глобальна</h3><p>Складність усієї системи; залежить від взаємодій і залежностей.</p></div></div>
<p class="sub" style="margin-top:14px">Дж. Майєрс: важливіша глобальна складність.</p></div></body></html>
