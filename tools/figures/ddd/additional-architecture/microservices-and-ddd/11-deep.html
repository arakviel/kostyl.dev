 <div class="col center" style="align-items:center"><div style="width:100px;height:260px;background:#dbeafe;border:3px solid #2563eb;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;text-align:center">Логіка</div><p class="cap">вузький інтерфейс, багато логіки:<br><b>глибокий</b></p></div>
 <div class="col center" style="align-items:center"><div style="width:300px;height:70px;background:#fee2e2;border:3px solid #dc2626;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;text-align:center">Логіка</div><p class="cap">широкий інтерфейс, мало логіки:<br><b>мілкий</b></p></div>
</div>
