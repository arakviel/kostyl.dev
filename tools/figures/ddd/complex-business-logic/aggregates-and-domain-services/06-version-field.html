<!doctype html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../_fig.css"></head><body><div id="fig">
<div class="title">Керування паралелізмом: версія агрегата</div>
<div class="card" style="background:#0f172a;color:#e2e8f0;font-family:ui-monospace,Menlo,monospace;font-size:20px;line-height:1.5;border-color:#0f172a;padding:18px 24px;white-space:pre;">UPDATE tickets
SET    ticket_status = @new_status,
       agg_version   = agg_version + 1
WHERE  ticket_id = @id <span style="color:#fbbf24">AND agg_version = @expected_version</span>;</div>
<p class="sub" style="margin-top:14px">Оновлення виконується лише якщо версія збігається з тією, що була прочитана до змін.</p></div></body></html>
