<div class="title">Проєкт, де мова вже склалась</div>
<div class="row">
 <div class="card red grow"><h3>Типова ситуація</h3><p class="cross">терміни збігаються з назвами таблиць</p><p class="cross">технічний жаргон у розмовах</p></div>
 <div class="card green grow"><h3>Що робити</h3><p class="tick">терпіння: мова змінюється повільно</p><p class="tick">спершу виправити документацію й код</p><p class="tick">іменники — англійською, якщо мова компанії інша</p></div>
