<template>
  <style>
    #root { position: absolute; inset: 0; background: #070b14; overflow: hidden; font-family: "Inter", sans-serif; color: #e8eef7; }
    svg { position: absolute; }
    .lab { position: absolute; font-weight: 700; white-space: nowrap; opacity: 0; }
    .mono { font-family: "JetBrains Mono", monospace; }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <div id="t1" class="lab" style="left:96px;top:190px;font-size:36px;color:#8aa0bd">іграшковий ландшафт втрати (ілюстрація)</div>
    <svg id="land" style="left:96px;top:250px;width:844px;height:450px" viewBox="0 0 844 450"><defs><clipPath id="cp"><rect x="0" y="0" width="844" height="450"/></clipPath></defs>
      <rect x="0" y="0" width="844" height="450" fill="#0b1220"/><g id="ell" clip-path="url(#cp)"></g>
      <g clip-path="url(#cp)"><polyline id="trA" fill="none" stroke="#fb7185" stroke-width="4" points=""/><polyline id="trB" fill="none" stroke="#22d3ee" stroke-width="4" points=""/>
      <circle id="bA" r="15" fill="#fb7185" cx="-50" cy="0"/><circle id="bB" r="15" fill="#22d3ee" cx="-50" cy="0"/></g></svg>
    <div id="tA" class="lab" style="left:110px;top:716px;font-size:34px;color:#fb7185">сталий великий крок</div>
    <div id="tB" class="lab" style="left:560px;top:716px;font-size:34px;color:#22d3ee">розігрів + косинус</div>
    <div id="t2" class="lab" style="left:1020px;top:190px;font-size:36px;color:#8aa0bd">швидкість навчання lr за кроками</div>
    <svg id="ch" style="left:1020px;top:250px;width:800px;height:450px" viewBox="0 0 800 450">
      <line x1="100" y1="400" x2="780" y2="400" stroke="rgba(255,255,255,0.2)" stroke-width="2"/><line x1="100" y1="20" x2="100" y2="400" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <text x="90" y="410" fill="#8aa0bd" font-size="28" text-anchor="end" font-family="JetBrains Mono">0</text>
      <text x="90" y="48" fill="#8aa0bd" font-size="28" text-anchor="end" font-family="JetBrains Mono">0,01</text>
      <line x1="100" y1="40" x2="780" y2="40" stroke="rgba(251,191,36,0.25)" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="100" y="442" fill="#8aa0bd" font-size="28" font-family="JetBrains Mono">0</text><text x="780" y="442" fill="#8aa0bd" font-size="28" text-anchor="end" font-family="JetBrains Mono">9380 кроків</text>
      <polyline id="lr" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round" points=""/>
      <circle id="mk" r="11" fill="#fbbf24" cx="-50" cy="0"/>
    </svg>
    <div id="wu" class="lab mono" style="left:1220px;top:470px;font-size:34px;color:#fbbf24">розігрів: 1 епоха</div>
    <div id="cs" class="lab mono" style="left:1220px;top:540px;font-size:34px;color:#fbbf24">косинус до кінця</div>
    <div id="l0" class="lab mono" style="left:1200px;top:252px;font-size:32px;color:#fbbf24">lr₀ = 0,01</div>
    <div id="r1" class="lab mono" style="left:96px;top:800px;font-size:58px;color:#34d399">розігрів + косинус: 99,05%</div>
    <div id="r2" class="lab mono" style="left:96px;top:880px;font-size:50px;color:#8aa0bd">сталий lr 1e-3: 98,76%</div>
    <div id="r3" class="lab" style="left:1100px;top:812px;font-size:36px;color:#8aa0bd;line-height:1.3">середнє за три запуски;<br>різниця ≈ 29 цифр із 10 000</div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const NS = "http://www.w3.org/2000/svg";
    // contours of f = x^2/2 + 20 y^2 (a long narrow valley along x)
    const SX = 844 / 8, SY = 450 / 6;
    const px = (x) => (x + 4) * SX, py = (y) => (3 - y) * SY;
    [0.5, 1.5, 4, 9, 16, 30].forEach((c) => { const e = document.createElementNS(NS, "ellipse"); e.setAttribute("cx", px(0)); e.setAttribute("cy", py(0)); e.setAttribute("rx", Math.sqrt(2 * c) * SX); e.setAttribute("ry", Math.sqrt(c / 20) * SY); e.setAttribute("fill", "none"); e.setAttribute("stroke", "rgba(34,211,238,0.28)"); e.setAttribute("stroke-width", 2); $("ell").appendChild(e); });
    // real learning-rate schedule from the lesson: LinearLR warm-up 1 epoch, then cosine to ~0 over 9 epochs
    const T = 9380, WU = 938;
    const lr = (t) => (t < WU ? 1e-4 + (0.01 - 1e-4) * t / WU : 0.01 * (1 + Math.cos(Math.PI * (t - WU) / (T - WU))) / 2);
    const cx = (t) => 100 + 680 * t / T, cy = (v) => 400 - 360 * v / 0.01;
    const pts = (a, b) => { const p = []; for (let t = a; t <= b; t += 20) p.push(cx(t) + "," + cy(lr(t))); p.push(cx(b) + "," + cy(lr(b))); return p.join(" "); };
    const G = { t: 0 };
    const drawLR = () => { const t = Math.min(T, Math.max(0, G.t)); $("lr").setAttribute("points", pts(0, t)); $("mk").setAttribute("cx", cx(t)); $("mk").setAttribute("cy", cy(lr(t))); };
    drawLR();
    // toy gradient descent on f: the same function, two step-size rules (a big constant step vs warm-up + cosine, scaled x4 for the toy)
    const grad = (x, y) => [x, 40 * y];
    const run = (etaOf, n) => { let x = -3, y = 1.2; const p = [[x, y]]; for (let s = 0; s < n; s++) { const e = etaOf(s), g = grad(x, y); x -= e * g[0]; y -= e * g[1]; p.push([x, y]); } return p; };
    const PA = run(() => 0.06, 8);
    const NB = 240; const PB = run((s) => 4 * lr((s / NB) * T), NB);
    const Sa = { i: 0 }, Sb = { i: 0 };
    const place = (id, trId, P, i) => { const n = Math.floor(i), f = i - n; const a = P[Math.min(n, P.length - 1)], b = P[Math.min(n + 1, P.length - 1)]; const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      $(id).setAttribute("cx", px(x)); $(id).setAttribute("cy", py(y));
      const tr = []; for (let k = 0; k <= n; k++) tr.push(px(P[k][0]) + "," + py(P[k][1])); tr.push(px(x) + "," + py(y)); $(trId).setAttribute("points", tr.join(" ")); };
    place("bA", "trA", PA, 0); place("bB", "trB", PB, 0);

    const tl = gsap.timeline({ paused: true });
    const show = (sel, at, d = 0.3) => tl.to(sel, { opacity: 1, duration: d, ease: "power2.out" }, at);
    // L1 0.4-6.6: the landscape and a ball at the start of the valley
    show("#t1", 0.8);
    tl.to("#bB", { r: 24, duration: 0.2 }, 4.0); tl.to("#bB", { r: 15, duration: 0.5 }, 4.2);
    // L2 7.0-13.7: big constant step, the ball jumps out of the valley
    show("#tA", 7.4);
    tl.to(Sa, { i: 3, duration: 3.0, ease: "none", onUpdate: () => place("bA", "trA", PA, Sa.i) }, 8.0);
    tl.to(Sa, { i: 8, duration: 2.0, ease: "power1.in", onUpdate: () => place("bA", "trA", PA, Sa.i) }, 11.0);
    // L3-L4 14.2-28.2: the real lr curve, warm-up then cosine
    show("#t2", 14.4); show("#wu", 16.6);
    tl.to(G, { t: WU, duration: 3.2, ease: "power1.inOut", onUpdate: drawLR }, 16.6);
    show("#l0", 20.4);
    tl.to(G, { t: T, duration: 3.6, ease: "power1.inOut", onUpdate: drawLR }, 24.4);
    show("#cs", 24.6);
    // L5 28.6-35.2: the same run on the toy landscape: it settles to the bottom
    show("#tB", 28.9);
    tl.to(G, { t: 0, duration: 0.6, ease: "power2.inOut", onUpdate: drawLR }, 28.4);
    tl.to(G, { t: T, duration: 5.6, ease: "none", onUpdate: drawLR }, 29.0);
    tl.to(Sb, { i: NB, duration: 5.6, ease: "none", onUpdate: () => place("bB", "trB", PB, Sb.i) }, 29.0);
    // L6-L7 35.6-52.9: the real accuracy figures
    show("#r1", 38.0); show("#r2", 41.0); show("#r3", 44.4);
    tl.to("#r1", { scale: 1.05, duration: 0.2, transformOrigin: "0 50%" }, 38.4); tl.to("#r1", { scale: 1, duration: 0.5 }, 38.6);
    // fill the pauses: marker and labels are pointed at while the voice names them
    [21.5, 22.6, 23.5].forEach((t, k) => { tl.to("#mk", { r: 17, duration: 0.2 }, t); tl.to("#mk", { r: 11, duration: 0.45 }, t + 0.25); });
    tl.to("#bB", { r: 24, duration: 0.2 }, 35.0); tl.to("#bB", { r: 15, duration: 0.45 }, 35.2);
    tl.to("#tB", { scale: 1.1, duration: 0.2, transformOrigin: "0 50%" }, 36.4); tl.to("#tB", { scale: 1, duration: 0.5 }, 36.6);
    [[45.8, "#r2"], [46.9, "#r1"], [49.0, "#r3"], [50.5, "#r1"], [52.0, "#r2"]].forEach(([t, id]) => { tl.to(id, { scale: 1.06, duration: 0.2, transformOrigin: "0 50%" }, t); tl.to(id, { scale: 1, duration: 0.5 }, t + 0.2); });
    window.__timelines["world"] = tl;
  </script>
</template>
