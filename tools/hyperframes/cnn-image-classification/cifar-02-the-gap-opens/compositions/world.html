    <div id="lleg" class="t fade" style="position:absolute;left:1020px;top:860px;font-size:30px;color:#8aa0bd"><span style="color:#34d399">— тест</span> &nbsp; <span style="color:#fb7185;opacity:.7">— навчання</span></div>

    const $ = (id) => document.getElementById(id);
    const NS = "http://www.w3.org/2000/svg";
    // chart frames
    const A = { x0: 130, x1: 880, y0: 810, y1: 300 }, L = { x0: 1054, x1: 1804, y0: 810, y1: 300 };
    const ax = (g, f, ymin, ymax, ticks, fmt) => {
      ticks.forEach((v) => { const y = f.y0 + (f.y1 - f.y0) * (v - ymin) / (ymax - ymin); const l = document.createElementNS(NS, "line"); l.setAttribute("x1", f.x0); l.setAttribute("x2", f.x1); l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("stroke", "rgba(255,255,255,0.08)"); l.setAttribute("stroke-width", 2); g.appendChild(l);
        const t = document.createElementNS(NS, "text"); t.setAttribute("x", f.x0 - 14); t.setAttribute("y", y + 8); t.setAttribute("fill", "#8aa0bd"); t.setAttribute("font-size", 28); t.setAttribute("text-anchor", "end"); t.setAttribute("font-family", "JetBrains Mono"); t.textContent = fmt(v); g.appendChild(t); });
      for (let e = 1; e <= 12; e += 1) { if (e % 2 && e !== 1) continue; const x = f.x0 + (f.x1 - f.x0) * (e - 1) / 11; const t = document.createElementNS(NS, "text"); t.setAttribute("x", x); t.setAttribute("y", f.y0 + 44); t.setAttribute("fill", "#8aa0bd"); t.setAttribute("font-size", 28); t.setAttribute("text-anchor", "middle"); t.setAttribute("font-family", "JetBrains Mono"); t.textContent = e; g.appendChild(t); }
    };

    ax($("axL"), L, 0.3, 1.6, [0.4, 0.8, 1.2, 1.6], (v) => v.toFixed(1));
    const X = (f, e) => f.x0 + (f.x1 - f.x0) * (e - 1) / 11;
    const YA = (v) => A.y0 + (A.y1 - A.y0) * (v - 50) / 45, YL = (v) => L.y0 + (L.y1 - L.y0) * (v - 0.3) / 1.3;
    // a series drawn up to the fractional epoch e (e in [1..12])
    const upto = (arr, f, Y, e) => { const pts = []; const n = Math.floor(e); for (let i = 1; i <= n; i++) pts.push([X(f, i), Y(arr[i - 1])]); if (e > n && n < 12) { const t = e - n; pts.push([X(f, e), Y(arr[n - 1] + (arr[n] - arr[n - 1]) * t)]); } return pts; };
    const str = (p) => p.map((q) => q[0] + "," + q[1]).join(" ");

      $("gap").setAttribute("points", str(p1.concat(p2.slice().reverse())));
      const e1 = p1[p1.length - 1], e2 = p2[p2.length - 1];

      $("epv").textContent = Math.min(12, Math.floor(S.a + 0.001));
    };
    const drawL = () => {

    };
    drawA(); drawL();
    // labels at the end of the curves
    const place = (id, x, y) => { $(id).style.left = x + "px"; $(id).style.top = y + "px"; };
    place("la1", 560, YA(89.3) - 74); place("la2", 600, YA(73.3) + 34); place("lag", 548, (YA(89.3) + YA(73.3)) / 2 - 20);
    place("lmn", 1280, YL(0.770) + 70); place("lmx", 1530, YL(0.929) - 70);
    $("dmin").setAttribute("cx", X(L, 8)); $("dmin").setAttribute("cy", YL(0.770));
    $("brk").setAttribute("x1", X(A, 12) + 26); $("brk").setAttribute("x2", X(A, 12) + 26); $("brk").setAttribute("y1", YA(89.3)); $("brk").setAttribute("y2", YA(73.3));

    const tl = gsap.timeline({ paused: true });
    const show = (sel, at, d = 0.3) => tl.to(sel, { opacity: 1, duration: d, ease: "power2.out" }, at);
    show("#t1", 0.8); show("#lleg2", 0.9); show("#ep", 1.0);

    show("#t2", 24.9); show("#lleg", 25.0);

    tl.to("#dmin", { opacity: 1, duration: 0.3 }, 30.8); show("#lmn", 30.9);
    tl.to(S, { l: 12, duration: 4.0, ease: "power1.inOut", onUpdate: drawL }, 32.6);
    show("#lmx", 36.4);

    tl.to("#gap", { fill: "rgba(251,113,133,0.45)", duration: 0.4 }, 38.8); tl.to("#gap", { fill: "rgba(251,113,133,0.28)", duration: 0.8 }, 40.0);

    tl.to("#dmin", { r: 20, duration: 0.2 }, 44.2); tl.to("#dmin", { r: 13, duration: 0.5 }, 44.4);

  </script>
