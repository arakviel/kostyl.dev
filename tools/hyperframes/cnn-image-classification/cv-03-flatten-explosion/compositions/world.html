    <img data-hf-id="hf-tisi" id="photo" src="assets/flower.jpg" alt="" />
  </div>
  <script>

    const N = 28, CW = 20;
    const shade = (v) => { const t = v / 255; return [Math.round(7 + 237 * t), Math.round(11 + 236 * t), Math.round(20 + 231 * t)]; };

    // 28 rows of the digit
    const flat = document.getElementById("flat");
    const rows = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement("canvas");
      c.width = N; c.height = 1; c.className = "row"; c.id = "row" + i;
      const cx = c.getContext("2d"); const im = cx.createImageData(N, 1);
      for (let j = 0; j < N; j++) im.data.set([...shade(D[i * N + j]), 255], j * 4);
      cx.putImageData(im, 0, 0);
      flat.appendChild(c); rows.push(c);
      gsap.set(c, { x: 0, y: i * CW });
    }
    gsap.set(flat, { x: 300, y: 260, scaleX: 1, scaleY: 1 });

    // the same 784 values as a 1-px-wide bar (replaces the rotated rows once they are in place)
    { const b = document.getElementById("bar").getContext("2d"); const im = b.createImageData(1, 784);
      D.forEach((v, k) => im.data.set([...shade(v), 255], k * 4)); b.putImageData(im, 0, 0); }

    // network geometry
    const X0 = 380, X1 = 1490, Y0 = 240, Y1 = 960;
    const yIn = (i) => Y0 + ((i + 0.5) * (Y1 - Y0)) / 784;
    const yNe = (j, n) => Y0 + ((j + 0.5) * (Y1 - Y0)) / n;
    const drawNeurons = (id, n, r) => {
      const g = document.getElementById(id).getContext("2d"); g.fillStyle = "#34d399";
      for (let j = 0; j < n; j++) { g.beginPath(); g.arc(X1 + 6, yNe(j, n), r, 0, Math.PI * 2); g.fill(); }
    };
    drawNeurons("n128", 128, 2.3); drawNeurons("n512", 512, 0.65);

    // 100 352 real lines, drawn incrementally as a function of time
    const net = document.getElementById("net").getContext("2d");
    net.lineWidth = 0.7; net.strokeStyle = "rgba(30,170,200,0.03)";
    let drawn = 0;
    const drawTo = (k) => {
      if (k < drawn) { net.clearRect(0, 0, 1920, 1080); drawn = 0; }
      for (let i = drawn; i < k; i++) {
        net.beginPath();
        const y0 = yIn(i);
        for (let j = 0; j < 128; j++) { net.moveTo(X0, y0); net.lineTo(X1, yNe(j, 128)); }
        net.stroke();
      }
      drawn = k;
    };

    const fan = document.getElementById("fan").getContext("2d");
    fan.lineWidth = 1; fan.strokeStyle = "rgba(94,234,212,0.5)";
    const drawFan = (k) => {
      fan.clearRect(0, 0, 1920, 1080);
      if (k <= 0 || k >= 784) return;
      fan.beginPath();
      for (let j = 0; j < 128; j++) { fan.moveTo(X0, yIn(k)); fan.lineTo(X1, yNe(j, 128)); }
      fan.stroke();
    };
    const tl = gsap.timeline({ paused: true });
    // 2.0-5.0 the rows peel off to the right into one long line, the group shrinks to fit it (1700 px)
    const L = 15680, S1 = 1700 / L;
    rows.forEach((r, i) =>
      tl.to(r, { x: i * 560, y: 0, duration: 1.0, ease: "power3.inOut" }, 2.0 + i * 0.07));
    tl.to("#flat", { x: 110, y: 540 - (20 * S1) / 2, scaleX: S1, scaleY: S1, duration: 2.3, ease: "power2.inOut" }, 2.0);
    tl.to("#flat", { y: 540 - (20 * S1 * 8) / 2, scaleY: S1 * 8, duration: 0.7, ease: "power2.out" }, 4.3);
    // 5.1-6.5 the line turns upright, shortens to 720 px and thickens into a 27 px bar, then slides left
    tl.to("#rot", { rotation: 90, x: -600, y: 60, duration: 1.4, ease: "power2.inOut" }, 5.1);
    tl.to("#flat", { x: 600, y: 540 - 13.5, scaleX: 720 / L, scaleY: 1.35, duration: 1.4, ease: "power2.inOut" }, 5.1);
    tl.set("#stripwin", { opacity: 1 }, 6.5);
    tl.set("#flat", { opacity: 0 }, 6.5);
    // 7.0 neurons appear
    tl.to("#n128", { opacity: 1, duration: 0.6, ease: "power2.out" }, 7.0);
    // 7.8-15.0 the lines
    const P = { u: 0 };
    tl.to(P, { u: 1, duration: 7.2, ease: "power2.in", onUpdate: () => { const k = Math.round(784 * P.u); drawTo(k); drawFan(k); } }, 7.8);
    // 15.2-17.7 a light pass across the finished set of lines: every one of them is a weight
    tl.fromTo("#sweepbar", { x: -260, opacity: 1 }, { x: 1110, opacity: 1, duration: 2.5, ease: "power1.inOut" }, 15.2);
    tl.set("#sweepbar", { opacity: 0 }, 17.75);
    // 20.0 the photo
    tl.to("#photo", { opacity: 1, duration: 0.2, ease: "power3.out" }, 20.0);
    // 22.5-26.8 the strip grows 192x (150 528 / 784), the lines are too many to draw
    tl.to("#bar", { scaleY: 192, duration: 4.3, ease: "power2.inOut" }, 22.5);
    tl.to("#net", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 22.5);
    tl.to("#wedge", { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 22.8);
    // 28.2 512 neurons
    tl.to("#n128", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 28.2);
    tl.to("#n512", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 28.2);

    window.__timelines["world"] = tl;
