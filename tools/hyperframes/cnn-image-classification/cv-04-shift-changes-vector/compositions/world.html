    const N = 28, CELL = 16;
    // original digit (white by brightness) and its amber ghost
    const paint = (id, fn) => {
      const c = document.getElementById(id); const g = c.getContext("2d"); const im = g.createImageData(N, N);
      D.forEach((v, i) => im.data.set(fn(v), i * 4)); g.putImageData(im, 0, 0);
    };
    paint("d1", (v) => [244, 247, 251, v]);
    paint("d2", (v) => [244, 247, 251, v]);
    paint("ghostc", (v) => (v > 128 ? [251, 191, 36, 80] : [0, 0, 0, 0]));

    // np.roll(image, k, axis=1) and the four cell states
    const rolled = (idx, k) => { const r = Math.floor(idx / N), c = idx % N; return D[r * N + ((c - k) % N + N) % N]; };
    const bandCtx = document.getElementById("band").getContext("2d");
    const stats = (k) => {
      let match = 0, changed = 0;
      const im = bandCtx.createImageData(784, 1);
      for (let i = 0; i < 784; i++) {
        const o = D[i] > 128, s = rolled(i, k) > 128;
        if (o && s) match++;
        if (D[i] !== rolled(i, k)) changed++;
        const col = o && s ? [251, 191, 36] : s ? [34, 211, 238] : o ? [150, 160, 176] : [11, 18, 32];
        im.data.set([...col, 255], i * 4);
      }
      bandCtx.putImageData(im, 0, 0);
      return { match, changed };
    };

    let lastK = -1;
    const U = { u: 0 };
    const update = () => {
      gsap.set("#d1", { x: U.u * CELL });
      gsap.set("#d2", { x: U.u * CELL - N * CELL });
      const k = Math.round(U.u);
      if (k === lastK) return;
      lastK = k;
      const s = stats(k);
      document.getElementById("shv").textContent = k;
      document.getElementById("m1").textContent = s.match;
      document.getElementById("mp").textContent = "(" + Math.round((100 * s.match) / 144) + "%)";
      document.getElementById("c1").textContent = s.changed;
    };
    update();

    const tl = gsap.timeline({ paused: true });
    // the vector appears with the voice saying "вектор", the numbers with the first shift
