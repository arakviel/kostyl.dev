<template>
  <style>

    .sum { position: absolute; left: 1250px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 52px; opacity: 0; white-space: nowrap; }
    .m { position: absolute; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 36px; background: #0b1220; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <div id="planes"></div>
    <svg id="svg" viewBox="0 0 1920 1080"></svg>
    <div id="wins"></div>

    <div id="w0" class="lab mono" style="left:1250px;top:216px;font-size:40px;color:#f87171">R: вага +1</div>
    <div id="w1" class="lab mono" style="left:1250px;top:268px;font-size:40px;color:#4ade80">G: вага 0</div>
    <div id="w2" class="lab mono" style="left:1250px;top:320px;font-size:40px;color:#60a5fa">B: вага −1</div>
    <div id="s0" class="sum" style="top:410px;color:#f87171">R: 1541</div>
    <div id="s1" class="sum" style="top:470px;color:#4ade80">G: 0</div>
    <div id="s2" class="sum" style="top:530px;color:#60a5fa">B: −911</div>

  <script>
    const PATCH = [[[229, 188, 132], [207, 147, 137], [86, 68, 30], [12, 23, 19]], [[235, 192, 150], [203, 143, 132], [81, 65, 32], [11, 22, 24]], [[231, 193, 148], [192, 134, 120], [77, 60, 30], [2, 18, 15]], [[230, 191, 158], [173, 117, 102], [53, 50, 17], [2, 18, 18]]];
    const $ = (id) => document.getElementById(id);
    const mk = (parent, cls, css, text, id) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); if (text !== undefined) d.textContent = text; if (id) d.id = id; parent.appendChild(d); return d; };
    const CS = 64;
    const LAY = [["R", "248,113,113", 110, 520], ["G", "74,222,128", 470, 440], ["B", "96,165,250", 830, 360]];
    const COLS = ["#f87171", "#4ade80", "#60a5fa"];
    LAY.forEach(([n, rgb, x, y], k) => {
      const pl = mk($("planes"), "pl", { left: x + "px", top: y + "px", width: 4 * CS + "px", height: 4 * CS + "px" }, undefined, "pl" + k);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const v = PATCH[r][c][k]; mk(pl, "c", { left: c * CS + "px", top: r * CS + "px", background: "rgba(" + rgb + "," + (0.12 + 0.55 * v / 255) + ")", color: "#e8eef7" }, v); }
      mk(pl, "lab", { left: "0px", top: "-74px", fontSize: "56px", fontFamily: '"JetBrains Mono", monospace', color: COLS[k], opacity: 1 }, n);
      mk($("wins"), "win", {}, undefined, "win" + k);
    });
    // prism edges between the three windows
    const NS = "http://www.w3.org/2000/svg";
    const edges = [];
    for (let e = 0; e < 8; e++) { const l = document.createElementNS(NS, "line"); l.setAttribute("stroke", "rgba(251,191,36,0.55)"); l.setAttribute("stroke-width", "3"); l.setAttribute("opacity", "0"); $("svg").appendChild(l); edges.push(l); }
    const S = { i: 0, j: 0, e: 0 };
    const upd = () => {
      const pos = LAY.map(([n, rgb, x, y]) => [x + S.j * CS, y + S.i * CS]);
      pos.forEach(([x, y], k) => gsap.set("#win" + k, { x: x, y: y }));
      const cs = [[0, 0], [192, 0], [0, 192], [192, 192]];
      for (let c = 0; c < 4; c++) for (let k = 0; k < 2; k++) {
        const a = pos[k], b = pos[k + 1], l = edges[c * 2 + k];
        l.setAttribute("x1", a[0] + cs[c][0]); l.setAttribute("y1", a[1] + cs[c][1]);
        l.setAttribute("x2", b[0] + cs[c][0]); l.setAttribute("y2", b[1] + cs[c][1]);
        l.setAttribute("opacity", S.e);
      }
    };
    gsap.set(".win", { left: 0, top: 0 });
    upd();
    // 2x2 map
    const OUT = [[630, 332], [586, 304]];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const m = mk($("mp"), "m", { left: 1250 + j * 110 + "px", top: 740 + i * 110 + "px", color: "#fbbf24" }, "", "m" + i + j); const sp = document.createElement("span"); sp.id = "mv" + i + j; sp.textContent = OUT[i][j]; sp.style.opacity = 0; m.appendChild(sp); }

    const tl = gsap.timeline({ paused: true });
    const show = (sel, at, d = 0.3) => tl.to(sel, { opacity: 1, duration: d, ease: "power2.out" }, at);
    const hide = (sel, at, d = 0.3) => tl.to(sel, { opacity: 0, duration: d, ease: "power2.in" }, at);
    // L1: three channels, three layers, then the cube
    [0, 1, 2].forEach((k) => show("#pl" + k, 0.6 + k * 0.6, 0.4));
    [0, 1, 2].forEach((k) => show("#win" + k, 5.2 + k * 0.3, 0.3));
    tl.to(S, { e: 1, duration: 0.6, onUpdate: upd }, 6.0);
    show("#cube", 5.6);
    // L2: the weights of the cube, layer by layer
    [[0, 9.0], [1, 10.3], [2, 11.9]].forEach(([k, at]) => { show("#w" + k, at, 0.3); tl.to("#win" + k, { backgroundColor: "rgba(" + ["248,113,113", "74,222,128", "96,165,250"][k] + ",0.28)", duration: 0.3 }, at); });
    // L3: the cube lies on the patch and goes through all channels at once
    [0, 1, 2].forEach((k) => { tl.to("#win" + k, { scale: 1.06, duration: 0.2, ease: "power2.out" }, 14.0 + k * 0.4); tl.to("#win" + k, { scale: 1, duration: 0.3 }, 14.2 + k * 0.4); });
    tl.to(S, { e: 2.2, duration: 0.2, onUpdate: upd }, 16.0); tl.to(S, { e: 1, duration: 0.5, onUpdate: upd }, 16.3);
    // 18.3-19.7 the nine cells of the red window are counted off while the voice says "червоний шар дає"
    for (let n = 0; n < 9; n++) { const r = Math.floor(n / 3), c = n % 3, sel = "#pl0 .c:nth-child(" + (r * 4 + c + 1) + ")";
      tl.to(sel, { boxShadow: "inset 0 0 0 5px #ffffff", duration: 0.1 }, 18.3 + n * 0.15); tl.to(sel, { boxShadow: "inset 0 0 0 2px rgba(7,11,20,0.5)", duration: 0.35 }, 18.4 + n * 0.15); }
    show("#s0", 20.0); tl.to("#win0", { boxShadow: "0 0 0 6px #ffffff", duration: 0.25 }, 19.8); tl.to("#win0", { boxShadow: "0 0 0 0px #ffffff", duration: 0.5 }, 20.2);
    // L4: G = 0, B = -911
    show("#s1", 22.2); tl.to("#win1", { boxShadow: "0 0 0 6px #ffffff", duration: 0.25 }, 22.0); tl.to("#win1", { boxShadow: "0 0 0 0px #ffffff", duration: 0.5 }, 22.4);
    show("#s2", 24.4); tl.to("#win2", { boxShadow: "0 0 0 6px #ffffff", duration: 0.25 }, 24.2); tl.to("#win2", { boxShadow: "0 0 0 0px #ffffff", duration: 0.5 }, 24.6);
    // L5: together 630
    show("#st", 28.2); show("#mlab", 28.8);
    tl.to(["#s0", "#s1", "#s2"], { opacity: 0.45, duration: 0.3 }, 28.4);
    tl.to("#mv00", { opacity: 1, duration: 0.3 }, 29.0);
    show("#t1", 29.5);
    // L6: the cube slides: 332, 586, 304
    hide("#t1", 32.3);
    tl.to(S, { j: 1, duration: 0.6, ease: "power2.inOut", onUpdate: upd }, 33.8); tl.to("#mv01", { opacity: 1, duration: 0.3 }, 35.0);
    tl.to(S, { i: 1, j: 0, duration: 0.7, ease: "power2.inOut", onUpdate: upd }, 35.7); tl.to("#mv10", { opacity: 1, duration: 0.3 }, 36.8);
    tl.to(S, { j: 1, duration: 0.6, ease: "power2.inOut", onUpdate: upd }, 37.5); tl.to("#mv11", { opacity: 1, duration: 0.3 }, 38.2);
    show("#t2", 39.3);
    window.__timelines["world"] = tl;
  </script>
</template>
