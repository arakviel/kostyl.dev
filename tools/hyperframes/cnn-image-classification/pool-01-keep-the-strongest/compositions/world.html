<template>
  <style>
    #root { position: absolute; inset: 0; background: #070b14; overflow: hidden; font-family: "Inter", sans-serif; color: #e8eef7; }
    .c { position: absolute; display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
    .lab { position: absolute; font-weight: 700; color: #8aa0bd; white-space: nowrap; opacity: 0; }
    .win { position: absolute; box-sizing: border-box; border: 6px solid #22d3ee; width: 240px; height: 240px; opacity: 0; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .fly { position: absolute; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 56px; background: #fbbf24; color: #070b14; opacity: 0; box-shadow: 0 0 0 3px #070b14; }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <div id="map"></div>
    <div id="olab" class="lab" style="left:120px;top:236px;font-size:40px">карта ознак 4 × 4</div>
    <div id="w0" class="win" style="left:120px;top:300px"></div>
    <div id="w1" class="win" style="left:360px;top:300px"></div>
    <div id="w2" class="win" style="left:120px;top:540px"></div>
    <div id="w3" class="win" style="left:360px;top:540px"></div>
    <div id="mlab" class="lab mono" style="left:800px;top:290px;font-size:46px;color:#fbbf24">max</div>
    <div id="mmap"></div>
    <div id="alab" class="lab mono" style="left:1250px;top:290px;font-size:46px;color:#22d3ee">average</div>
    <div id="amap"></div>
    <div id="cnt" class="lab mono" style="left:800px;top:660px;font-size:64px;color:#e8eef7">16 чисел → 4</div>
    <div id="fl"></div>
    <div id="forms"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const V = [[1,3,2,1],[4,6,5,2],[7,2,9,4],[1,0,3,8]];
    const MX = [[6,5],[7,9]], AV = [["3.5","2.5"],["2.5","6.0"]];
    const mk = (parent, cls, css, text, id) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); if (text !== undefined) d.textContent = text; if (id) d.id = id; parent.appendChild(d); return d; };
    const shade = (v) => { const t = v / 9; return "rgb(" + [Math.round(11 + 23 * t), Math.round(18 + 150 * t), Math.round(32 + 160 * t)].join(",") + ")"; };
    const C = 120, X0 = 120, Y0 = 300;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) mk($("map"), "c", { left: X0 + c * C + "px", top: Y0 + r * C + "px", width: C + "px", height: C + "px", background: shade(V[r][c]), color: V[r][c] >= 6 ? "#070b14" : "#e8eef7", fontSize: "52px" }, V[r][c], "m" + r + c);
    const MXX = 800, MXY = 360, AXX = 1250;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      mk($("mmap"), "c", { left: MXX + j * C + "px", top: MXY + i * C + "px", width: C + "px", height: C + "px", background: "#0b1220", color: "#fbbf24", fontSize: "56px" }, "", "x" + i + j);
      const sp = document.createElement("span"); sp.id = "xv" + i + j; sp.textContent = MX[i][j]; sp.style.opacity = 0; $("x" + i + j).appendChild(sp);
      mk($("amap"), "c", { left: AXX + j * C + "px", top: MXY + i * C + "px", width: C + "px", height: C + "px", background: "#0b1220", color: "#22d3ee", fontSize: "50px" }, "", "a" + i + j);
      const sa = document.createElement("span"); sa.id = "av" + i + j; sa.textContent = AV[i][j]; sa.style.opacity = 0; $("a" + i + j).appendChild(sa);
      const f = mk($("fl"), "fly", {}, MX[i][j], "f" + i + j); f.style.left = X0 + (j * 2) * C + "px"; f.style.top = Y0 + (i * 2) * C + "px";
    }
    const FM = ["(1 + 3 + 4 + 6) / 4 = 3.5", "(2 + 1 + 5 + 2) / 4 = 2.5", "(7 + 2 + 1 + 0) / 4 = 2.5", "(9 + 4 + 3 + 8) / 4 = 6.0"];
    FM.forEach((t, k) => mk($("forms"), "lab mono", { left: "1100px", top: 640 + k * 62 + "px", fontSize: "44px", color: "#22d3ee" }, t, "fm" + k));
    // the position of each window's winner inside the map
    const WIN = [[1, 1], [1, 2], [2, 0], [2, 2]];
    const tl = gsap.timeline({ paused: true });
    const show = (sel, at, d = 0.25) => tl.to(sel, { opacity: 1, duration: d, ease: "power2.out" }, at);
    const hide = (sel, at, d = 0.3) => tl.to(sel, { opacity: 0, duration: d, ease: "power2.in" }, at);
    show("#olab", 0.8);
    // L1: the map, then the four windows
    for (let w = 0; w < 4; w++) show("#w" + w, 3.0 + w * 0.45, 0.25);
    // L2 5.8-11.9: window 0 on its own: the four numbers compete, the biggest stays
    for (let w = 1; w < 4; w++) tl.to("#w" + w, { opacity: 0.25, duration: 0.3 }, 6.0);
    tl.to("#w0", { backgroundColor: "rgba(34,211,238,0.14)", duration: 0.3 }, 6.0);
    const cell = (i, j) => "#m" + i + j;
    [[0,0],[0,1],[1,0],[1,1]].forEach(([r, c], k) => { tl.to(cell(r, c), { scale: 1.18, duration: 0.15, ease: "power2.out" }, 6.4 + k * 0.4); tl.to(cell(r, c), { scale: 1, duration: 0.25 }, 6.55 + k * 0.4); });
    show("#mlab", 8.1);
    // the winner (6) turns amber, the others dim
    tl.to("#m11", { backgroundColor: "#fbbf24", color: "#070b14", duration: 0.3 }, 8.6);
    ["#m00", "#m01", "#m10"].forEach((id) => tl.to(id, { opacity: 0.3, duration: 0.4 }, 9.2));
    // it flies to the output
    const fly = (i, j, at, srcR, srcC) => {
      tl.set("#f" + i + j, { opacity: 1, x: 0, y: 0, left: X0 + srcC * C, top: Y0 + srcR * C }, at);
      tl.to("#f" + i + j, { x: MXX - (X0 + srcC * C) + j * C, y: MXY - (Y0 + srcR * C) + i * C, duration: 0.9, ease: "power3.inOut" }, at);
      tl.to("#xv" + i + j, { opacity: 1, duration: 0.15 }, at + 0.85);
      tl.set("#f" + i + j, { opacity: 0 }, at + 0.95);
    };
    fly(0, 0, 10.2, 1, 1);
    // L3 12.4-21.8: the same in every window
    tl.to("#m00, #m01, #m10", { opacity: 1, duration: 0.3 }, 12.6);
    tl.to("#m11", { backgroundColor: shade(6), color: "#070b14", duration: 0.3 }, 12.6);
    const grp = [[0, 1, 0, 2, 15.2], [1, 0, 2, 0, 16.4], [1, 1, 2, 2, 17.4]];
    [[0, 1, 1, 2, 15.2], [1, 0, 2, 0, 16.4], [1, 1, 3, 3, 17.4]].forEach(([i, j, wr, wc, at], n) => {
      // the winner's own cell: window (i,j) covers rows 2i..2i+1, cols 2j..2j+1
      const cells = [[2*i,2*j],[2*i,2*j+1],[2*i+1,2*j],[2*i+1,2*j+1]];
      let best = cells[0]; cells.forEach(([r, c]) => { if (V[r][c] > V[best[0]][best[1]]) best = [r, c]; });
      tl.to("#w" + (i * 2 + j), { opacity: 1, duration: 0.2 }, at - 0.9);
      tl.to(cell(best[0], best[1]), { backgroundColor: "#fbbf24", color: "#070b14", duration: 0.25 }, at - 0.4);
      fly(i, j, at, best[0], best[1]);
    });
    show("#cnt", 19.6);
    tl.to("#mmap", { filter: "brightness(1.6)", duration: 0.2 }, 20.6); tl.to("#mmap", { filter: "brightness(1)", duration: 0.5 }, 20.8);
    // L4 22.3-30.3: the average, a softer map
    show("#alab", 22.7);
    [[0,0,26.4],[0,1,27.5],[1,0,28.3],[1,1,29.4]].forEach(([i, j, at]) => {
      tl.to("#av" + i + j, { opacity: 1, duration: 0.2 }, at);
      tl.to("#w" + (i * 2 + j), { opacity: 1, duration: 0.2 }, at - 0.5);
      tl.to("#w" + (i * 2 + j), { opacity: 0.25, duration: 0.3 }, at + 0.6);
    });
    // the formulas stay, one line per window, each a moment before its result
    [[0, 23.8], [1, 26.0], [2, 27.1], [3, 28.0]].forEach(([k, a]) => tl.to("#fm" + k, { opacity: 1, duration: 0.25 }, a));
    tl.to("#cnt", { opacity: 0, duration: 0.3 }, 22.2);
    tl.to("#w0", { opacity: 1, duration: 0.2 }, 23.8); tl.to("#w0", { opacity: 0.25, duration: 0.3 }, 26.0);
    window.__timelines["world"] = tl;
  </script>
</template>
