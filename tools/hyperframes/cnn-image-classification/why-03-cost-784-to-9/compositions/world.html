    const IX = 110, IY = 330, CS = 20, NX = 1050, NY0 = 300, NDY = 24, CH = 13;

    const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    // the digit
    { const g = $("img").getContext("2d"), im = g.createImageData(28, 28);
      D.forEach((v, i) => { const t = v / 255; im.data.set([Math.round(7 + 237 * t), Math.round(11 + 236 * t), Math.round(20 + 231 * t), 255], i * 4); });
      g.putImageData(im, 0, 0); }

    const px = (i) => [IX + (i % 28 + 0.5) * CS, IY + (Math.floor(i / 28) + 0.5) * CS];
    const ny = (j) => NY0 + j * NDY;
    // the 26 neurons shown
    { const g = $("nodes").getContext("2d");
      for (let j = 0; j < 26; j++) { g.beginPath(); g.arc(NX, ny(j), j === CH ? 11 : 6, 0, Math.PI * 2); g.fillStyle = "#34d399"; g.fill(); } }
    gsap.set("#nodes", { opacity: 0 });

    // the dense fans: node CH first (bright), then the other 25 (faint)
    const dense = $("dense").getContext("2d");
    const fan = (g, j, a, b) => { g.beginPath(); for (let i = a; i < b; i++) { const [x, y] = px(i); g.moveTo(x, y); g.lineTo(NX, ny(j)); } g.stroke(); };
    let dm = 0, dn = 0;
    const others = []; for (let j = 0; j < 26; j++) if (j !== CH) others.push(j);
    const drawDense = (m, n) => {
      if (m < dm || n < dn) { dense.clearRect(0, 0, 1920, 1080); dm = 0; dn = 0; }
      dense.lineWidth = 0.8; dense.strokeStyle = "rgba(94,234,212,0.30)"; fan(dense, CH, dm, m); dm = m;
      dense.lineWidth = 0.7; dense.strokeStyle = "rgba(30,170,200,0.075)";
      for (let k = dn; k < n; k++) fan(dense, others[k], 0, 784);
      dn = n;
    };
    // the local fans: 9 lines per neuron, to its own 3x3 window (window of neuron j: rows j..j+2, cols 13..15)
    const win9 = (j) => { const a = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) a.push([(j + r) * 28 + CH + c, c]); return a; };
    const loc = (id, test, style, w) => { const g = $(id).getContext("2d"); g.lineWidth = w; g.strokeStyle = style; g.beginPath();
      for (let j = 0; j < 26; j++) win9(j).forEach(([i, c]) => { if (test(c, j)) { const [x, y] = px(i); g.moveTo(x, y); g.lineTo(NX, ny(j)); } }); g.stroke(); };

    loc("locR", (c) => c !== 1, "rgba(251,113,133,0.75)", 1.6);
    loc("locG", (c) => c === 1, "rgba(52,211,153,0.85)", 1.6);
    gsap.set(["#locC", "#locR", "#locG"], { opacity: 0 });

    // the shared weights
    { const k = $("kmat"); const col = ["#fb7185", "#34d399", "#fb7185"], txt = ["−1", "+1", "−1"];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const d = document.createElement("div"); d.className = "kc"; d.style.left = c * 72 + "px"; d.style.top = r * 72 + "px"; d.style.background = col[c]; d.style.color = "#070b14"; d.textContent = txt[c]; k.appendChild(d); } }

    // map of the 26 x 26 window positions: filled as the window passes them
    const pm = $("pmap").getContext("2d");
    const drawMap = (k) => {
      pm.clearRect(0, 0, 468, 468);
      for (let i = 0; i < 676; i++) {
        const x = (i % 26) * 18, y = Math.floor(i / 26) * 18;
        pm.fillStyle = i < k ? "rgba(34,211,238,0.55)" : "rgba(255,255,255,0.05)";
        pm.fillRect(x + 1, y + 1, 16, 16);
      }
      if (k > 0 && k <= 676) { const i = k - 1; pm.fillStyle = "#fbbf24"; pm.fillRect((i % 26) * 18 + 1, Math.floor(i / 26) * 18 + 1, 16, 16); }
    };
    drawMap(0);
    const tl = gsap.timeline({ paused: true });
    const show = (sel, at, d = 0.2) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, at);

      gsap.set("#win", { x: (kk % 26) * CS, y: Math.floor(kk / 26) * CS });
      $("n1").textContent = k; drawMap(k); } }, 4.8);

    tl.to(Q, { m: 784, duration: 2.0, ease: "power1.inOut", onUpdate: () => drawDense(Math.round(Q.m), Math.round(Q.n)) }, 16.4);
