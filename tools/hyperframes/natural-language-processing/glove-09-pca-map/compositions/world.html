<script>

const CAT = [
 ["Країни", ["france","germany","italy","spain","russia"], "#60a5fa"],
 ["Столиці", ["paris","berlin","rome","madrid","moscow"], "#34d399"],
 ["Технології", ["computer","software","internet","technology","digital"], "#fbbf24"],

 ["Тварини", ["dog","cat","horse","bird","fish"], "#f472b6"]];

    `<div id="b${c}" class="abs blk" style="top:${[340,440,540,680,820,925][c]}px"><div class="n mono" style="color:${col}">${name}</div><div class="w">${ws.join(" ")}</div></div>`);
});

tl.to("#d1", { opacity: 1, duration: 0.4 }, 1.2);
tl.to("#d2", { opacity: 1, duration: 0.4 }, 6.6);
tl.to("#plane", { borderColor: "#3b5a8a", duration: 0.5, yoyo: true, repeat: 1 }, 3.0);
tl.to("#plane", { borderColor: "#3b5a8a", duration: 0.5, yoyo: true, repeat: 1 }, 7.9);
tl.to("#d1", { scale: 1.05, transformOrigin: "left center", duration: 0.4, yoyo: true, repeat: 1 }, 9.0);
// L2 10.2-18.2
for (let c = 0; c < 6; c++) tl.to(dots(c), { opacity: 1, duration: 0.3, stagger: 0.04 }, 10.5 + c * 0.1);
colour(0, 12.7); colour(1, 14.0);

tl.to(["#e0", "#e1"], { opacity: 0.8, duration: 0.5 }, 16.4);
// L3 18.9-23.7
colour(2, 19.2); colour(3, 20.3); colour(4, 21.9);
tl.to(["#e2", "#e3"], { opacity: 0.8, duration: 0.5 }, 20.9);
tl.to("#e4", { opacity: 0.8, duration: 0.5 }, 22.6);
// L4 24.3-27.7
colour(5, 24.7); tl.to("#e5", { opacity: 0.8, duration: 0.5 }, 25.6);
// L5 28.3-33.8
for (let c = 0; c < 6; c++) tl.to(`#e${c}`, { opacity: 0.4, duration: 0.4, yoyo: true, repeat: 1 }, 29.0 + c * 0.7);
tl.to("#stage", { opacity: 0, duration: 0.3 }, 34.2);
window.__timelines["world"] = tl;
</script>
